services:
  postgres:
    image: postgres:16-alpine
    container_name: healthclaim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthclaim_user
      POSTGRES_PASSWORD: healthclaim_pass
      POSTGRES_DB: healthclaim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthclaim_user -d healthclaim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: healthclaim-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
