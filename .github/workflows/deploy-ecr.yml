name: CD - Build & Push Docker Image to Amazon ECR

# ------------------------------------------------------------------------------
# Security Gate: Only triggers when both CI and E2E workflows succeed on 'main'
# ------------------------------------------------------------------------------
on:
  workflow_run:
    workflows:
      - 'CI - Lint, Test & SAST/SCA Analysis'
      - 'E2E & DAST - Playwright & Dynamic Security Testing'
    branches: [main]
    types: [completed]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-ecr:
    name: Build, Push ECR & Deploy ECS
    runs-on: ubuntu-latest
    # Strict Gate: If triggered by workflow_run, verify that upstream workflows concluded with success
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      id-token: write # Required for AWS OIDC Federation
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'healthclaim-pro' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # AWS Authentication via OIDC (Zero Permanent Keys)
      # ------------------------------------------------------------------------
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------------------
      # Build & Push Multi-Stage Container Image
      # ------------------------------------------------------------------------
      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Optional: Trigger Zero-Downtime Rolling Update on AWS ECS
      # (Only triggers if ECS_CLUSTER and ECS_SERVICE variables are configured)
      # ------------------------------------------------------------------------
      - name: Trigger AWS ECS Rolling Update
        if: env.ECS_CLUSTER != '' && env.ECS_SERVICE != ''
        run: |
          echo "🚀 Triggering zero-downtime rolling update on ECS Cluster: $ECS_CLUSTER, Service: $ECS_SERVICE..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          echo "✅ Rolling deployment dispatched to AWS ECS successfully."
