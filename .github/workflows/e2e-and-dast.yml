name: E2E & DAST - Playwright & Dynamic Security Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Playwright End-to-End Browser Integration Tests
  # ----------------------------------------------------------------------------
  playwright-e2e:
    name: Playwright Fullstack E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthclaim_user
          POSTGRES_PASSWORD: healthclaim_pass
          POSTGRES_DB: healthclaim_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    env:
      DATABASE_URL: postgresql://healthclaim_user:healthclaim_pass@localhost:5432/healthclaim_db?schema=public
      JWT_SECRET: super_secret_healthclaim_pro_jwt_key_ci_2026!
      MASTER_ENCRYPTION_KEY: super_master_encryption_key_32_bytes!
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: healthclaim-receipts
      S3_FORCE_PATH_STYLE: true
      PORT: 4000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Database Schema & Seed Data
        run: |
          pnpm --filter backend prisma:generate
          pnpm --filter backend prisma:push
          pnpm --filter backend prisma:seed

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: pnpm test:e2e

      - name: Upload Playwright Trace & Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 2: DAST - OWASP ZAP Dynamic Application Security Penetration Testing
  # ----------------------------------------------------------------------------
  owasp-zap-dast:
    name: OWASP ZAP DAST Security Scan
    runs-on: ubuntu-latest
    needs: [playwright-e2e]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthclaim_user
          POSTGRES_PASSWORD: healthclaim_pass
          POSTGRES_DB: healthclaim_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data

    env:
      DATABASE_URL: postgresql://healthclaim_user:healthclaim_pass@localhost:5432/healthclaim_db?schema=public
      JWT_SECRET: super_secret_healthclaim_pro_jwt_key_ci_2026!
      MASTER_ENCRYPTION_KEY: super_master_encryption_key_32_bytes!
      PORT: 4000
      API_PREFIX: /api/v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install & Bootstrap Services
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter backend prisma:generate
          pnpm --filter backend prisma:push
          pnpm --filter backend prisma:seed
          pnpm build

      - name: Start Background Server for DAST Scanning
        run: |
          node backend/dist/main.js &
          sleep 5

      - name: OWASP ZAP Baseline Dynamic Penetration Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:4000/api/v1/departments'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
