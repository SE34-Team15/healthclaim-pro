name: CI - Lint, Test & SAST/SCA Analysis

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Type Checking & Build Integrity
  # ----------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend prisma:generate

      - name: Workspace Lint & TypeCheck
        run: pnpm lint

      - name: Fullstack Build
        run: pnpm build

  # ----------------------------------------------------------------------------
  # Job 2: Unit Test Suite & Actuarial Coverage Gates (>= 85%)
  # ----------------------------------------------------------------------------
  unit-tests-and-coverage:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os }}-pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend prisma:generate

      - name: Run Vitest with Coverage Threshold Gates
        run: pnpm test:cov

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: backend/coverage
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: SAST - GitHub Official CodeQL Static Security Analysis
  # ----------------------------------------------------------------------------
  codeql-sast-scan:
    name: GitHub CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ----------------------------------------------------------------------------
  # Job 4: SCA - Dependency Review & Supply Chain Security
  # ----------------------------------------------------------------------------
  dependency-review-sca:
    name: GitHub Dependency Review SCA
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: GitHub Official Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
